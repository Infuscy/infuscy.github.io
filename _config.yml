# Site settings
title: Febuse
email: buse.florinx@gmail.com
url: https://infuscy.github.io
description: "Site personal: investigații de date statice despre Bacalaureat, analiză juridică și civică (HCL 419/2025 Craiova) și ficțiune — totul 100% în browser, fără urmărire."
meta_author: Buse Florin-Emilian

# Color settings (hex-codes without the leading hash-tag).
# Mirrors the BAC report design tokens: blue accent on a slate ground.
color:
  primary: "2563eb"
  primary-rgb: "37,99,235"
  secondary: "0f172a"
  secondary-dark: "020617"   # quoted: unquoted it parses as an octal number

# Footer settings
footer:
  copyright: Febuse
  location: Locație
  social: Pe web
  credits: Credite

# Social networks usernames
social:
  - title: twitter
    url: https://twitter.com/xfebuse
  - title: facebook
    url: https://www.facebook.com/florin.emilian.buse
  - title: linkedin
    url: https://ro.linkedin.com/in/febuse

# Postal address
address:
  - line: Romania

# Credits content
credits: 'Proiecte personale: rapoarte de date statice (Python, React), analiză juridică verificată din surse primare, ficțiune publicată static. <br>Datele Bacalaureatului provin de pe <a href="https://static.bacalaureat.edu.ro/">static.bacalaureat.edu.ro</a>.'

# Build settings
markdown: kramdown
# Explicit pattern: keeps front-matter `category` (shown in modals) out of post URLs.
# `pretty` would inject categories, producing "/investigatie de date/..." paths with spaces.
permalink: /:year/:month/:day/:title/

# Jekyll excludes dotfiles by default; publish .well-known/
include:
  - ".well-known"

# Repo-only files: internal docs, build scripts, and the chapter Markdown
# sources (translated/*.md feed scripts/build-novel.js; the site serves the .html).
# Listing exclude replaces Jekyll's defaults, so Gemfile & co. are repeated here.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - AUDIT.md
  - BUGFIX_SPEC.md
  - CLAUDE.md
  - README.md
  - SECURITY.md
  - scripts
  - "translated/*.md"

# Posts are data for the report grid/modals, not pages. Their URLs only
# redirect to the report itself (see _layouts/report-redirect.html).
defaults:
  - scope:
      type: posts
    values:
      layout: report-redirect
