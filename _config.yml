# Site settings
title: Rapoarte BAC
email: contact@febuse.com
url: https://infuscy.github.io
description: "Investigații de date statice despre rezultatele Bacalaureatului. Hărți, distribuții, anomalii și explorare SQL live — 100% în browser."
skills: "Investigații de date · Rapoarte statice · 100% în browser"
meta_author: Buse Florin-Emilian

# Color settings (hex-codes without the leading hash-tag).
# Mirrors the BAC report design tokens: blue accent on a slate ground.
color:
  primary: 2563eb
  primary-rgb: "37,99,235"
  secondary: 0f172a
  secondary-dark: 020617

# Footer settings
footer:
  copyright: Febuse
  location: Locatie
  social: Pe web
  credits: Credite

# Social networks usernames
social:
  - title: twitter
    url: https://twitter.com/xfebuse
  - title: facebook
    url: https://www.facebook.com/florin.emilian.buse
  - title: linkedin
    url: https://ro.linkedin.com/in/febuse

# Postal address
address:
  - line: Romania

# Credits content
credits: 'Rapoarte de date independente, construite cu Python, React si DuckDB-WASM. <br>Datele sursă provin de pe <a href="https://static.bacalaureat.edu.ro/">static.bacalaureat.edu.ro</a>.'

# Build settings
markdown: kramdown
# Explicit pattern: keeps front-matter `category` (shown in modals) out of post URLs.
# `pretty` would inject categories, producing "/investigatie de date/..." paths with spaces.
permalink: /:year/:month/:day/:title/

# Jekyll excludes dotfiles by default; publish .well-known/
include:
  - ".well-known"
