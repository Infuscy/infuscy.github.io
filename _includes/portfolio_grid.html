
    <!-- Portfolio Grid Section -->
    <section id="portfolio">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2>Rapoarte</h2>
                    <hr class="star-primary">
                </div>
            </div>
            <div class="row">
                {% for post in site.posts reversed %}
                    <!-- reversed: chronological order (2025 -> 2026 -> delta) -->
                    <div class="col-sm-4 portfolio-item">
                        <a href="#portfolioModal-{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
                            <div class="caption">
                                <div class="caption-content">
                                    <i class="fa fa-search-plus fa-3x"></i>
                                </div>
                            </div>
                            <img src="img/portfolio/{{ post.img }}" class="img-responsive" alt="{{ post.alt }}">
                        </a>
                        <div class="portfolio-caption">
                            {% if post == site.posts.first %}
                                <span class="label label-primary latest-badge">Cel mai recent</span>
                            {% endif %}
                            <h4>{{ post.title }}</h4>
                            <p class="text-muted">{{ post.project-date }} &middot; {{ post.category }}</p>
                            {% if post.stats %}
                                <p class="portfolio-stats">{{ post.stats }}</p>
                            {% endif %}
                            <a class="btn btn-primary btn-sm" href="/{{ post.report }}/" target="_blank" rel="noopener">
                                <i class="fa fa-bar-chart"></i> Deschide raportul &rarr;
                            </a>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </section>
