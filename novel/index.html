---
layout: page
title: "Novel"
---

<style>
/* ponytail: ToC styles inline since they're specific to this one page */
.toc-wrap {
  padding: 6rem 0 4rem;
  min-height: 80vh;
}
.toc-wrap .container {
  max-width: 42rem;
}
.toc-header {
  text-align: center;
  margin-bottom: 2rem;
}
.toc-header h1 {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -.025em;
  color: #0f172a;
  margin: 0 0 .5rem;
}
.toc-header p {
  color: #64748b;
  font-size: 1rem;
  margin: 0;
}
.toc-search {
  display: block;
  width: 100%;
  padding: .75rem 1rem;
  border: 1px solid #e2e8f0;
  border-radius: .75rem;
  font-size: 1rem;
  font-family: inherit;
  margin-bottom: 1.5rem;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.toc-search:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.toc-search::placeholder {
  color: #94a3b8;
}
.toc-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.toc-list li {
  border-bottom: 1px solid #f1f5f9;
}
.toc-list li:last-child {
  border-bottom: 0;
}
.toc-list a {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: .65rem .5rem;
  text-decoration: none;
  color: #0f172a;
  border-radius: .375rem;
  transition: background .1s;
}
.toc-list a:hover {
  background: #f8fafc;
  color: #2563eb;
}
.toc-list .chapter-num {
  color: #94a3b8;
  font-size: .85rem;
  font-weight: 500;
  min-width: 2.5rem;
  text-align: right;
}
.toc-list .chapter-title {
  font-weight: 500;
  flex: 1;
  margin-left: .75rem;
}
.toc-volume-divider {
  padding: 1rem .5rem .5rem;
  font-size: .8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: #2563eb;
  border-bottom: 1px solid #f1f5f9;
}
.toc-empty {
  text-align: center;
  color: #94a3b8;
  padding: 3rem 0;
  font-style: italic;
}
.toc-note {
  text-align: center;
  color: #94a3b8;
  font-size: .85rem;
  margin: 1.5rem auto 0;
  max-width: 34rem;
  line-height: 1.5;
}
@media (max-width: 600px) {
  .toc-wrap { padding: 5rem 0 3rem; }
  .toc-header h1 { font-size: 1.6rem; }
}
</style>

<div class="toc-wrap">
  <div class="container">
    <div class="toc-header">
      <h1>Table of Contents</h1>
      <p>1,862 chapters — a Warcraft fanfiction novel</p>
      <p class="toc-note">Unofficial fan work. Warcraft is a trademark of Blizzard Entertainment — this project is not affiliated with or endorsed by Blizzard.</p>
    </div>

    <input type="text" class="toc-search" id="tocSearch" placeholder="Search chapters by title or number…" autofocus>

    <ul class="toc-list" id="tocList"></ul>
    <p class="toc-empty" id="tocEmpty" style="display:none">No chapters match your search.</p>
  </div>
</div>

<script>
// Client-side chapter list + search
const CHAPTERS = [
  {% for ch in site.data.novel_chapters %}
  { "num": {{ ch.num }}, "title": {{ ch.title | jsonify }}, "file": {{ ch.file | jsonify }} }{% unless forloop.last %},{% endunless %}
  {% endfor %}
];

// Escape strings before injecting into innerHTML (titles come from site data)
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// Known volume markers: chapter number -> volume label
const VOLUMES = { 514: "Volume 6", 1758: "Volume 19", 1816: "Volume 20" };

function renderToc(filter) {
  var list = document.getElementById('tocList');
  var empty = document.getElementById('tocEmpty');
  var q = (filter || '').toLowerCase().trim();
  var html = '';
  var count = 0;

  for (var i = 0; i < CHAPTERS.length; i++) {
    var ch = CHAPTERS[i];
    if (q && ch.title.toLowerCase().indexOf(q) === -1 && String(ch.num).indexOf(q) === -1) {
      continue;
    }
    if (VOLUMES[ch.num]) {
      html += '<li class="toc-volume-divider">' + esc(VOLUMES[ch.num]) + '</li>';
    }
    html += '<li><a href="/translated/' + esc(ch.file) + '">' +
      '<span class="chapter-num">' + esc(ch.num) + '</span>' +
      '<span class="chapter-title">' + esc(ch.title) + '</span>' +
      '</a></li>';
    count++;
  }

  list.innerHTML = html;
  empty.style.display = count === 0 ? '' : 'none';
}

document.getElementById('tocSearch').addEventListener('input', function(e) {
  renderToc(e.target.value);
});

renderToc('');
</script>
